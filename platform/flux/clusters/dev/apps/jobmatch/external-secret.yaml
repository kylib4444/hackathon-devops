apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openai-auth-secret
  namespace: agentgateway-system
spec:
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: openai-auth-secret
  data:
    - secretKey: api-key 
      remoteRef:
        key: openai-api-key
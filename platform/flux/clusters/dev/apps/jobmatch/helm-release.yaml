apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jobmatch-dev
  namespace: jobmatch-dev
spec:
  interval: 5m
  chart:
    spec:
      chart: ./platform/helm/jobmatch
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  install:
    remediation:
      retries: 3
  values:
    global:
      environment: stage
    api:
      replicaCount: 1
      image:
        repository: ghcr.io/kylib4444/jobmatch-api
        tag: "latest"
        pullPolicy: Always
      env:
        # Перемикаємо на openai, оскільки це єдиний робочий ключ
        LLM_PROVIDER: "openai"
        # Вказуємо шлях до нашого Kgateway
        GATEWAY_URL: "http://agentgateway-external.agentgateway-system.svc.cluster.local"
    web:
      replicaCount: 1
      service:
        type: LoadBalancer
        port: 80
        targetPort: 80
      image:
        repository: ghcr.io/kylib4444/jobmatch-web
        tag: "latest"
    redis:
      enabled: true
      image:
        registry: docker.io
        repository: bitnami/redis
        tag: latest
    qdrant:
      enabled: true

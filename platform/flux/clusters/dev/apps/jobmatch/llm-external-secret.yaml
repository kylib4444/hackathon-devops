apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-auth
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-store 
  target:
    name: claude-auth-secret
  data:
  - secretKey: api-key
    remoteRef:
      key: claude-api-key 

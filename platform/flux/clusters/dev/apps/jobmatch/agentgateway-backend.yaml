apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-for-complex-task
  namespace: agentgateway-system
spec:
  ai:
    # Видалили 'strategy', бо кластер його не підтримує
    groups:
      - providers:
          # Основний провайдер
          - name: openai-gpt
            openai:
              model: gpt-4o-mini
            policies:
              auth:
                secretRef:
                  # Видалили 'key', припускаємо, що система очікує 
                  # ключ 'api-key' всередині цього секрету
                  name: llm-secrets
          
          # Фейловер 1: Gemini
          - name: gemini-flash
            gemini:
              model: gemini-1.5-flash
            policies:
              auth:
                secretRef:
                  name: llm-secrets

          # Фейловер 2: Gemini Pro
          - name: gemini-pro
            gemini:
              model: gemini-1.5-pro
            policies:
              auth:
                secretRef:
                  name: llm-secrets
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-for-complex-task
  namespace: agentgateway-system
  labels:
    environment: development
spec:
  ai:
    strategy: Failover 
    groups:
    - name: tier-1-pro
      providers:
      - name: gemini-pro-primary
        gemini:
          model: models/gemini-2.5-pro
        policies:
          auth:
            secretRef:
              name: gemini-auth-secret
    - name: tier-2-flash-fallback
      providers:
      - name: gemini-flash-fallback
        gemini:
          model: models/gemini-2.0-flash
        policies:
          auth:
            secretRef:
              name: gemini-auth-secret
    - name: tier-3-openai-fallback
      providers:
      - name: openai-fallback
        openai:
          model: gpt-4o
        policies:
          auth:
            secretRef:
              name: openai-auth-secret
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend 
metadata:
  name: llm-for-simple-task
  namespace: agentgateway-system
  labels:
    environment: development
spec:
  ai:
    strategy: Failover
    groups:
    - name: fast-flash-primary
      providers:
      - name: gemini-flash-primary
        gemini:
          model: models/gemini-2.0-flash
        policies:
          auth:
            secretRef:
              name: gemini-auth-secret
    - name: fallback-openai-mini
      providers:
      - name: openai-fallback-fast
        openai:
          model: gpt-4o-mini
        policies:
          auth:
            secretRef:
              name: openai-auth-secret
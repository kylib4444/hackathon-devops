apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-for-complex-task
  namespace: agentgateway-system
spec:
  ai:
    groups:
    - providers:
      # Isolate to Flash to bypass OpenAI/Pro 429s and Claude 401s
      - name: gemini-flash-primary
        gemini:
          model: models/gemini-2.0-flash
        policies:
          auth:
            secretRef:
              name: gemini-auth-secret
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend 
metadata:
  name: llm-for-simple-task
  namespace: agentgateway-system
spec:
  ai:
    groups:
    - providers:
      - name: gemini-flash-primary
        gemini:
          model: models/gemini-2.0-flash
        policies:
          auth:
            secretRef:
              name: gemini-auth-secret
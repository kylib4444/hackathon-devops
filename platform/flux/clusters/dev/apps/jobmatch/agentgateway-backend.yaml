apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-for-complex-task
  namespace: agentgateway-system
spec:
  ai:
    # Стратегія Failover працює як ланцюжок: 
    # якщо перший провайдер повертає 4xx/5xx, перемикаємося на наступний
    strategy: Failover 
    groups:
      - providers:
          # Рівень 1: OpenAI
          - name: openai-gpt
            openai:
              model: gpt-4o-mini
            policies:
              auth:
                secretRef:
                  name: llm-secrets
                  key: openai-api-key
          
          # Рівень 2: Gemini Flash (швидкий, для пошуку/матчингу)
          - name: gemini-flash
            gemini:
              model: gemini-1.5-flash
            policies:
              auth:
                secretRef:
                  name: llm-secrets
                  key: gemini-api-key
          
          # Рівень 3: Gemini Pro (більш інтелектуальний, як "остання лінія оборони")
          - name: gemini-pro
            gemini:
              model: gemini-1.5-pro
            policies:
              auth:
                secretRef:
                  name: llm-secrets
                  key: gemini-api-key
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-for-complex-task
  namespace: agentgateway-system
  labels:
    environment: development
spec:
  ai:
    groups:
    - providers:
      - name: claude-primary
        anthropic:
          model: claude-3-5-sonnet-20240620
        policies:
          auth:
            secretRef:
              name: claude-auth-secret
      - name: openai-fallback
        openai:
          model: gpt-4o
        policies:
          auth:
            secretRef:
              name: openai-auth-secret
      - name: gemini-fallback
        gemini:
          model: models/gemini-2.5-pro
        policies:
          auth:
            secretRef:
              name: gemini-auth-secret
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend 
metadata:
  name: llm-for-simple-task
  namespace: agentgateway-system
  labels:
    environment: development
spec:
  ai:
    groups:
    - providers:
      - name: claude-primary-fast
        anthropic:
          model: claude-3-haiku-20240307
        policies:
          auth:
            secretRef:
              name: claude-auth-secret
      - name: openai-fallback-fast
        openai:
          model: gpt-4o-mini
        policies:
          auth:
            secretRef:
              name: openai-auth-secret
      - name: gemini-fallback-fast
        gemini:
          model: models/gemini-2.0-flash
        policies:
          auth:
            secretRef:
              name: gemini-auth-secret
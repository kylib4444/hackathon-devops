apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-for-complex-task
  namespace: agentgateway-system
spec:
  ai:
    groups:
      - providers:
          - name: claude-haiku
            anthropic:
              model: claude-haiku-4-5
            policies:
              auth:
                secretRef:
                  name: llm-secrets
                  key: claude-api-key
          - name: gemini-flash
            gemini:
              model: gemini-3.5-flash
            policies:
              auth:
                secretRef:
                  name: llm-secrets
                  key: gemini-api-key
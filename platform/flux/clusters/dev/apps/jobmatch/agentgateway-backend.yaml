apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-for-complex-task
  namespace: agentgateway-system
spec:
  ai:
    groups:
    - providers:
      # 1. Пріоритет: Claude
      - name: claude-primary
        anthropic:
          model: claude-3-5-sonnet-20240620
        policies:
          auth:
            secretRef:
              name: claude-auth-secret
      # 2. Пріоритет: OpenAI
      - name: openai-fallback
        openai:
          model: gpt-4o
        policies:
          auth:
            secretRef:
              name: openai-auth-secret
      # 3. Пріоритет: Gemini (Pro як основний, Flash як фінальний)
#      - name: gemini-pro-fallback
#        gemini:
#          model: models/gemini-2.5-pro
#        policies:
#          auth:
#            secretRef:
#              name: gemini-auth-secret
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend 
metadata:
  name: llm-for-simple-task
  namespace: agentgateway-system
spec:
  ai:
    groups:
    - providers:
      # 1. Пріоритет: Claude Haiku
      - name: claude-fast-primary
        anthropic:
          model: claude-3-haiku-20240307
        policies:
          auth:
            secretRef:
              name: claude-auth-secret
      # 2. Пріоритет: OpenAI Mini
      - name: openai-fast-fallback
        openai:
          model: gpt-4o-mini
        policies:
          auth:
            secretRef:
              name: openai-auth-secret
      # 3. Пріоритет: Gemini Flash
      - name: gemini-flash-fallback
        gemini:
          model: models/gemini-2.0-flash
        policies:
          auth:
            secretRef:
              name: gemini-auth-secret
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-for-complex-task
  namespace: agentgateway-system
spec:
  ai:
    # Failover спрацює, якщо провайдер поверне помилку (4xx/5xx)
    strategy: Failover 
    groups:
      - providers:
          # Основний провайдер (перша спроба)
          - name: openai-gpt
            openai:
              model: gpt-4o-mini
            policies:
              auth:
                secretRef:
                  name: llm-secrets
                  key: openai-api-key
          
          # Фейловер 1: Gemini Flash (якщо OpenAI впав або 429)
          - name: gemini-flash
            gemini:
              model: gemini-1.5-flash
            policies:
              auth:
                secretRef:
                  name: llm-secrets
                  key: gemini-api-key

          # Фейловер 2: Gemini Pro (остання спроба)
          - name: gemini-pro
            gemini:
              model: gemini-1.5-pro
            policies:
              auth:
                secretRef:
                  name: llm-secrets
                  key: gemini-api-key